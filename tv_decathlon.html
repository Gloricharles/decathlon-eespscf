:root {
  --ink: #0A0A0A; --paper: #FFFFFF; --bg: #111318;
  --green: #7DC740; --border: rgba(255,255,255,0.08);
  --gold: #FFD700; --silver: #C8C8C8; --bronze: #CD8C5A;
  --muted: rgba(255,255,255,0.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: white; font-family: 'Space Grotesk', sans-serif; }

/* ── SLIDE ── */
.slide {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  opacity: 0; transition: opacity 0.8s ease;
  pointer-events: none;
}
.slide.active { opacity: 1; pointer-events: all; }

/* ── HEADER SLIDE ── */
.slide-head {
  background: var(--ink);
  padding: 18px 40px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--green);
  flex-shrink: 0;
}
.slide-head-left { display: flex; align-items: center; gap: 20px; }
.school-tag { font-size: 11px; letter-spacing: 3px; color: var(--green); text-transform: uppercase; }
.cat-name { font-family: 'Black Han Sans', sans-serif; font-size: 38px; text-transform: uppercase; line-height: 1; }
.slide-head-right { text-align: right; }
.slide-date { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
.slide-counter { font-family: 'Black Han Sans', sans-serif; font-size: 28px; color: var(--green); line-height: 1; margin-top: 2px; }

/* ── PROGRESS BAR ── */
.progress-bar {
  height: 3px; background: rgba(255,255,255,0.06); flex-shrink: 0;
}
.progress-fill {
  height: 100%; background: var(--green);
  transition: none;
}

/* ── TABLE AREA ── */
.table-area {
  flex: 1; overflow: hidden;
  padding: 0 32px 16px;
  display: flex; flex-direction: column;
}

table { width: 100%; border-collapse: collapse; table-layout: fixed; }

thead th {
  padding: 10px 8px 8px;
  font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--border);
  font-weight: 600; text-align: center; background: var(--bg);
  position: sticky; top: 0; z-index: 2;
}
thead th.tl { text-align: left; }
thead th.ep-h { font-size: 22px; letter-spacing: 0; padding: 8px 4px; }

tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 0 8px; text-align: center; }
tbody td.tl { text-align: left; }

/* Hauteur dynamique calculée par JS */
.row-content { display: flex; align-items: center; justify-content: center; height: 100%; }

/* Rank */
.rb { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; font-family: 'Black Han Sans', sans-serif; font-size: 15px; }
.rb1 { background: var(--gold); color: #7A5800; }
.rb2 { background: var(--silver); color: #333; }
.rb3 { background: var(--bronze); color: white; }
.rbn { color: rgba(255,255,255,0.2); font-size: 14px; }

/* Name */
.nom-cell { font-weight: 700; font-size: 15px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cl-cell  { font-size: 12px; color: var(--muted); }

/* Total */
.tot { font-family: 'Black Han Sans', sans-serif; font-size: 22px; color: white; }

/* Score */
.sc { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.sc-ok { background: rgba(125,199,64,0.18); color: #9AE055; }
.sc-no { color: rgba(255,255,255,0.12); font-size: 16px; }
.sc-g  { background: rgba(255,215,0,0.2); color: var(--gold); border: 1px solid rgba(255,215,0,0.4); }
.sc-s  { background: rgba(200,200,200,0.15); color: var(--silver); border: 1px solid rgba(200,200,200,0.3); }
.sc-b  { background: rgba(205,140,90,0.2); color: var(--bronze); border: 1px solid rgba(205,140,90,0.4); }

/* Podium row highlights */
.row-g td { background: rgba(255,215,0,0.06); }
.row-s td { background: rgba(200,200,200,0.04); }
.row-b td { background: rgba(205,140,90,0.05); }

/* ── FOOTER ── */
.slide-foot {
  background: var(--ink);
  padding: 8px 40px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.foot-legend { display: flex; gap: 20px; }
.leg { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.leg-dot { width: 10px; height: 10px; border-radius: 2px; }
.foot-nav { display: flex; gap: 6px; align-items: center; }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.3s; }
.nav-dot.active { background: var(--green); width: 20px; border-radius: 4px; }

/* ── CONTROLS (cachés en présentation) ── */
.controls {
  position: fixed; bottom: 20px; right: 20px; z-index: 100;
  display: flex; gap: 8px; align-items: center;
  background: rgba(0,0,0,0.8); padding: 10px 14px; border-radius: 8px;
  backdrop-filter: blur(10px);
}
.ctrl-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 6px 14px; border-radius: 4px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.ctrl-btn:hover { background: rgba(255,255,255,0.2); }
.ctrl-btn.active { background: var(--green); color: #111; }
.ctrl-speed { color: rgba(255,255,255,0.5); font-size: 11px; }
.ctrl-hide { opacity: 0; transition: opacity 0.5s; }
</style>
</head>

const CATS  = Object.keys(DATA);

let current = 0;
let playing = true;
let duration = 12000;
let timer = null;
let hideControlsTimer = null;

// ── BUILD SLIDES ──────────────────────────────────────────────
function buildSlides() {
  const container = document.getElementById('slides');

  CATS.forEach((cat, ci) => {
    const rows = DATA[cat];
    const slide = document.createElement('div');
    slide.className = 'slide' + (ci === 0 ? ' active' : '');
    slide.id = `slide-${ci}`;

    // Calcul rangs par épreuve
    const epRanks = {};
    EPS.forEach((_,i) => {
      const vals = rows.filter(r=>r.scores[String(i)]!=null).map(r=>({nom:r.nom,val:r.scores[String(i)]}));
      vals.sort((a,b)=> EP_SENS[i]==='max' ? b.val-a.val : a.val-b.val);
      vals.forEach((v,idx) => {
        if(!epRanks[v.nom]) epRanks[v.nom]={};
        epRanks[v.nom][i] = idx+1;
      });
    });

    // Nombre de lignes visible = calculé dynamiquement
    const epH = EPS.map((e,i) => `<th class="ep-h" title="${NAMES[i]}">${e}</th>`).join('');

    let rowsHtml = '';
    rows.forEach(r => {
      const rc = r.rang===1?'row-g':r.rang===2?'row-s':r.rang===3?'row-b':'';
      const rb = r.rang===1?'rb1':r.rang===2?'rb2':r.rang===3?'rb3':'rbn';
      const medal = r.rang===1?'🥇':r.rang===2?'🥈':r.rang===3?'🥉':r.rang;
      const cells = EPS.map((_,i) => {
        const s = r.scores[String(i)];
        if (s==null) return `<td><span class="sc sc-no">—</span></td>`;
        const rk = epRanks[r.nom] && epRanks[r.nom][i];
        const cls = rk===1?'sc-g':rk===2?'sc-s':rk===3?'sc-b':'sc-ok';
        const m = rk===1?'🥇 ':rk===2?'🥈 ':rk===3?'🥉 ':'';
        return `<td><span class="sc ${cls}">${m}${s}</span></td>`;
      }).join('');

      rowsHtml += `<tr class="${rc}" data-row>
        <td><div class="row-content"><span class="rb ${rb}">${medal}</span></div></td>
        <td class="tl"><div class="row-content" style="justify-content:flex-start"><span class="nom-cell">${r.nom}</span></div></td>
        <td class="tl"><div class="row-content" style="justify-content:flex-start"><span class="cl-cell">${r.classe}</span></div></td>
        <td><div class="row-content"><span class="tot">${r.total}</span></div></td>
        ${cells}
      </tr>`;
    });

    // Nav dots
    const dots = CATS.map((_,i) => `<div class="nav-dot${i===ci?' active':''}" id="dot-${ci}-${i}"></div>`).join('');

    slide.innerHTML = `
      <div class="slide-head">
        <div class="slide-head-left">
          <div>
            <div class="school-tag">EESPSCF Châtelet · Décathlon 2026</div>
            <div class="cat-name">${cat}</div>
          </div>
        </div>
        <div class="slide-head-right">
          <div class="slide-date">Lundi 2 juin 2026</div>
          <div class="slide-counter">${ci+1} / ${CATS.length}</div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-${ci}" style="width:0%"></div></div>
      <div class="table-area">
        <table id="tbl-${ci}">
          <colgroup>
            <col style="width:36px">
            <col style="width:16%">
            <col style="width:7%">
            <col style="width:7%">
            ${EPS.map(()=>'<col style="width:6.5%">').join('')}
          </colgroup>
          <thead><tr>
            <th>#</th><th class="tl">Nom</th><th class="tl">Classe</th><th>Total</th>
            ${epH}
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      <div class="slide-foot">
        <div class="foot-legend">
          <div class="leg"><div class="leg-dot" style="background:#7DC740"></div>Score réalisé</div>
          <div class="leg"><span style="color:var(--gold)">🥇</span>Meilleur score de la catégorie</div>
          <div class="leg"><span style="color:var(--silver)">🥈</span>2e meilleur</div>
          <div class="leg"><span style="color:var(--bronze)">🥉</span>3e meilleur</div>
        </div>
        <div class="foot-nav">${dots}</div>
      </div>`;

    container.appendChild(slide);
  });

  // Adapter hauteur des lignes
  adaptRowHeights();
}

function adaptRowHeights() {
  CATS.forEach((cat, ci) => {
    const tbl = document.getElementById(`tbl-${ci}`);
    if (!tbl) return;
    const rows = DATA[cat];
    const area = tbl.closest('.table-area');
    if (!area) return;
    const available = area.clientHeight - 45; // minus thead
    const rh = Math.max(28, Math.floor(available / rows.length));
    tbl.querySelectorAll('tbody tr').forEach(tr => { tr.style.height = rh + 'px'; });
    // Adapter font-size si trop de lignes
    const fs = rh < 34 ? Math.max(10, rh * 0.38) : 13;
    tbl.querySelectorAll('tbody td').forEach(td => { td.style.fontSize = fs + 'px'; });
    tbl.querySelectorAll('.nom-cell').forEach(el => { el.style.fontSize = (fs+1) + 'px'; });
    tbl.querySelectorAll('.tot').forEach(el => { el.style.fontSize = (fs+4) + 'px'; });
    tbl.querySelectorAll('.sc').forEach(el => { el.style.fontSize = (fs-1) + 'px'; });
    tbl.querySelectorAll('.rb').forEach(el => { el.style.width = el.style.height = Math.min(32, rh-6) + 'px'; el.style.fontSize = Math.min(15, rh*0.35) + 'px'; });
    tbl.querySelectorAll('thead th.ep-h').forEach(el => { el.style.fontSize = Math.min(22, rh*0.7) + 'px'; });
  });
}

// ── NAVIGATION ────────────────────────────────────────────────
function showSlide(idx) {
  const prev = document.getElementById(`slide-${current}`);
  if (prev) prev.classList.remove('active');
  current = ((idx % CATS.length) + CATS.length) % CATS.length;
  const next = document.getElementById(`slide-${current}`);
  if (next) next.classList.add('active');
  // Update all nav dots
  document.querySelectorAll('.nav-dot').forEach(d => d.classList.remove('active'));
  CATS.forEach((_,ci) => {
    const dot = document.getElementById(`dot-${ci}-${current}`);
    if (dot) dot.classList.add('active');
  });
  startProgress();
}

function nextSlide() { clearTimer(); showSlide(current + 1); if (playing) startTimer(); }
function prevSlide() { clearTimer(); showSlide(current - 1); if (playing) startTimer(); }

function startProgress() {
  const bar = document.getElementById(`prog-${current}`);
  if (!bar) return;
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => {
    bar.style.transition = `width ${duration}ms linear`;
    bar.style.width = '100%';
  });
}

function startTimer() {
  clearTimer();
  timer = setTimeout(() => { showSlide(current + 1); if (playing) startTimer(); }, duration);
  startProgress();
}

function clearTimer() {
  if (timer) clearTimeout(timer);
  const bar = document.getElementById(`prog-${current}`);
  if (bar) { bar.style.transition = 'none'; bar.style.width = '0%'; }
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? '⏸ Pause' : '▶ Play';
  document.getElementById('playBtn').classList.toggle('active', playing);
  if (playing) startTimer(); else clearTimer();
}

function setDuration(s) { duration = s * 1000; if (playing) startTimer(); }

// Auto-cacher les contrôles
document.addEventListener('mousemove', () => {
  const ctrl = document.getElementById('controls');
  ctrl.classList.remove('ctrl-hide');
  clearTimeout(hideControlsTimer);
  hideControlsTimer = setTimeout(() => ctrl.classList.add('ctrl-hide'), 4000);
});

// Clavier
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
  if (e.key === 'p' || e.key === 'P') togglePlay();
});

window.addEventListener('load', () => {
  buildSlides();
  setTimeout(startTimer, 500);
});
window.addEventListener('resize', adaptRowHeights);
</script>
